version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit loopback_users []"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - app_net

  logic_service:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: logic_service
    working_dir: /app
    command: >
      sh -c "mvn -q -DskipTests compile exec:java -Dexec.mainClass=com.taller2jee.logic.grpc.GrpcServerApplication"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_QUEUE: email_notifications
      GRPC_PORT: 50051
    volumes:
      - ./:/app
      - logic_data:/app/data
      - maven_cache:/root/.m2
    ports:
      - "50051:50051"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app_net

  email_service:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: email_service
    working_dir: /app
    command: >
      sh -c "mvn -q -DskipTests compile exec:java -Dexec.mainClass=com.taller2jee.email.EmailConsumerApplication"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_QUEUE: email_notifications
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-user@example.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-changeme}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
    volumes:
      - ./:/app
      - maven_cache:/root/.m2
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app_net

volumes:
  logic_data:
  maven_cache:

networks:
  app_net:
    driver: bridge
